version: '3.7'

networks:
  casevault_net:
    name: casevault_net

services:
  orderer.casevault.police.gov.in:
    container_name: orderer.casevault.police.gov.in
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./network/organizations/ordererOrganizations/casevault.police.gov.in/orderers/orderer.casevault.police.gov.in/msp:/var/hyperledger/orderer/msp
      - ./network/organizations/ordererOrganizations/casevault.police.gov.in/orderers/orderer.casevault.police.gov.in/tls:/var/hyperledger/orderer/tls
    ports:
      - 7050:7050
      - 7053:7053
    networks:
      - casevault_net

  peer0.police.casevault.police.gov.in:
    container_name: peer0.police.casevault.police.gov.in
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=casevault_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.police.casevault.police.gov.in
      - CORE_PEER_ADDRESS=peer0.police.casevault.police.gov.in:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.police.casevault.police.gov.in:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.police.casevault.police.gov.in:7051
      - CORE_PEER_LOCALMSPID=PoliceOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./network/organizations/peerOrganizations/police.casevault.police.gov.in/peers/peer0.police.casevault.police.gov.in/msp:/etc/hyperledger/fabric/msp
      - ./network/organizations/peerOrganizations/police.casevault.police.gov.in/peers/peer0.police.casevault.police.gov.in/tls:/etc/hyperledger/fabric/tls
    ports:
      - 7051:7051
      - 9443:9443
    networks:
      - casevault_net

  peer0.fsl.casevault.police.gov.in:
    container_name: peer0.fsl.casevault.police.gov.in
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=casevault_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.fsl.casevault.police.gov.in
      - CORE_PEER_ADDRESS=peer0.fsl.casevault.police.gov.in:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.fsl.casevault.police.gov.in:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.fsl.casevault.police.gov.in:9051
      - CORE_PEER_LOCALMSPID=FSLOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./network/organizations/peerOrganizations/fsl.casevault.police.gov.in/peers/peer0.fsl.casevault.police.gov.in/msp:/etc/hyperledger/fabric/msp
      - ./network/organizations/peerOrganizations/fsl.casevault.police.gov.in/peers/peer0.fsl.casevault.police.gov.in/tls:/etc/hyperledger/fabric/tls
    ports:
      - 9051:9051
      - 9444:9444
    networks:
      - casevault_net

  peer0.cyber.casevault.police.gov.in:
    container_name: peer0.cyber.casevault.police.gov.in
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=casevault_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.cyber.casevault.police.gov.in
      - CORE_PEER_ADDRESS=peer0.cyber.casevault.police.gov.in:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.cyber.casevault.police.gov.in:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.cyber.casevault.police.gov.in:11051
      - CORE_PEER_LOCALMSPID=CyberCellOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./network/organizations/peerOrganizations/cyber.casevault.police.gov.in/peers/peer0.cyber.casevault.police.gov.in/msp:/etc/hyperledger/fabric/msp
      - ./network/organizations/peerOrganizations/cyber.casevault.police.gov.in/peers/peer0.cyber.casevault.police.gov.in/tls:/etc/hyperledger/fabric/tls
    ports:
      - 11051:11051
      - 9445:9445
    networks:
      - casevault_net

  cli:
    container_name: casevault-cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.police.casevault.police.gov.in:7051
      - CORE_PEER_LOCALMSPID=PoliceOrgMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/police.casevault.police.gov.in/peers/peer0.police.casevault.police.gov.in/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/police.casevault.police.gov.in/peers/peer0.police.casevault.police.gov.in/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/police.casevault.police.gov.in/peers/peer0.police.casevault.police.gov.in/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/police.casevault.police.gov.in/users/Admin@police.casevault.police.gov.in/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./chaincode:/opt/gopath/src/github.com/hyperledger/fabric-samples/chaincode
      - ./network:/opt/gopath/src/github.com/hyperledger/fabric/peer
    networks:
      - casevault_net
